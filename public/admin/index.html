<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="/css/admin.css" />
</head>
<body class="admin-body">

<!-- Giris ekrani -->
<div class="admin-login-wrap" id="loginWrap">
  <div class="admin-login-card">
    <h1>Admin Paneli</h1>
    <div class="sub">Mağazanı yönetmek için giriş yap</div>
    <div class="form-error" id="adminLoginError"></div>
    <form id="adminLoginForm">
      <div class="field">
        <label>Kullanıcı adı</label>
        <input type="text" name="username" required autofocus />
      </div>
      <div class="field">
        <label>Şifre</label>
        <input type="password" name="password" required />
      </div>
      <button class="btn btn-primary btn-block" type="submit">Giriş Yap</button>
    </form>
  </div>
</div>

<!-- Dashboard -->
<div id="dashboard" style="display:none">
  <div class="admin-topbar">
    <div class="container">
      <div class="brand-mini">Mağaza <span>Admin</span></div>
      <div class="right">
        <button class="bell-btn" id="bellBtn" title="Bildirimleri etkinleştir">
          🔔<span class="badge" id="notifBadge" style="display:none">0</span>
        </button>
        <button class="logout-mini" id="adminLogoutBtn">Çıkış</button>
      </div>
    </div>
  </div>

  <div class="admin-tabs">
    <div class="container">
      <button class="admin-tab-btn active" data-atab="orders">Siparişler</button>
      <button class="admin-tab-btn" data-atab="products">Ürünler</button>
    </div>
  </div>

  <div class="container">
    <div class="stat-row" id="statRow"></div>

    <section id="ordersTab">
      <div id="ordersContainer"><div class="loading-row">Yükleniyor...</div></div>
    </section>

    <section id="productsTab" style="display:none">
      <div class="admin-products-head">
        <h2 style="margin:0">Ürünler</h2>
        <button class="btn btn-primary btn-sm" id="addProductBtn">+ Yeni Ürün</button>
      </div>
      <div style="overflow-x:auto">
        <table class="admin-product-table">
          <thead>
            <tr>
              <th></th><th>Ürün</th><th>Fiyat</th><th>Stok</th><th>Durum</th><th></th>
            </tr>
          </thead>
          <tbody id="productsTableBody">
            <tr><td colspan="6" class="loading-row">Yükleniyor...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>
</div>

<!-- Urun ekle/duzenle modal -->
<div class="overlay" id="productModalOverlay"></div>
<div class="modal" id="productModal" style="max-width:440px">
  <button class="modal-close" data-close="productModal">✕</button>
  <h3 id="productModalTitle">Yeni Ürün</h3>
  <div class="form-error" id="productError"></div>
  <form id="productForm">
    <input type="hidden" name="id" />
    <div class="field">
      <label>Ürün Fotoğrafı</label>
      <input type="file" name="image" accept="image/*" id="imageInput" style="display:none" />
      <div class="image-upload-preview" id="imagePreview">Fotoğraf seçmek için tıkla</div>
    </div>
    <div class="field">
      <label>Ürün Adı</label>
      <input type="text" name="name" required />
    </div>
    <div class="field">
      <label>Açıklama</label>
      <textarea name="description" placeholder="Ürün hakkında kısa bilgi"></textarea>
    </div>
    <div class="field">
      <label>Fiyat (₺)</label>
      <input type="number" name="price" min="0" step="0.01" required />
    </div>
    <div class="field">
      <label>Stok Adedi</label>
      <input type="number" name="stock" min="0" step="1" required />
    </div>
    <div class="field" id="activeField" style="display:none">
      <label><input type="checkbox" name="active" style="width:auto" /> Sitede görünsün</label>
    </div>
    <button class="btn btn-primary btn-block" type="submit">Kaydet</button>
  </form>
</div>

<div class="toast" id="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
